#:schema https://yazi-rs.github.io/schemas/yazi.json
[mgr]
ratio          = [ 1, 3, 4 ]
sort_by        = "natural"
sort_dir_first = true
linemode       = "size"
show_hidden    = false
scrolloff      = 6

[preview]
max_width     = 1600
max_height    = 1600
image_quality = 90

# git-статус файлов справа от имени
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
