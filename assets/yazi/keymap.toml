#:schema https://yazi-rs.github.io/schemas/keymap.json
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Войти в папку или открыть файл"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Войти в папку или открыть файл"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Развернуть / вернуть предпросмотр"

[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/IdeaProjects"
desc = "Перейти в ~/IdeaProjects"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Documents"
desc = "Перейти в ~/Documents"

[[mgr.prepend_keymap]]
on   = "<C-o>"
run  = 'shell --orphan -- dolphin --select "$0"'
desc = "Показать в Dolphin (для drag-n-drop)"

[[mgr.prepend_keymap]]
on   = "<C-t>"
run  = 'shell --orphan -- konsole --workdir "$PWD"'
desc = "Открыть Konsole в текущей папке"
